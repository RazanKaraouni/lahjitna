    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-white" href="index.html">
                <img src="assets/logo.jpeg" alt="لهجتنا Logo" class="d-inline-block align-text-top rounded-circle border border-white">
                <span>لهجتنا</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="القائمة">

            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
